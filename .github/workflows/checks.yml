name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --all-extras ruff format --check .
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras pytest
