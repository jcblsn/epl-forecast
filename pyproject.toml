[project]
name = "epl-forecast"
version = "0.1.0"
description = "Probabilistic Premier League and Championship forecasts and season simulation"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
    "pytz>=2026.3.post1",
    "scipy>=1.18.1",
]

[project.scripts]
epl-forecast = "epl_forecast.cli:main"

[project.optional-dependencies]
research = [
    "numpyro>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
