# The boundary between the private local archive and the publishable forecast
# surface. `epl_forecast.publication` builds every published document from the
# allowlist below and then re-checks the result against it, so a key that is not
# named here cannot reach the site.
schema_version = 1

[surface]
allowed_keys = [
  "archived_at",
  "away_team_id",
  "brier",
  "checks",
  "classwise_ece",
  "code_sha256",
  "commit",
  "competition_id",
  "competition_name",
  "competitions",
  "current_points",
  "draw",
  "events",
  "failures",
  "generated_at",
  "grid_home_rows_away_columns",
  "home_team_id",
  "home_rate",
  "away_rate",
  "href",
  "kickoff_time",
  "latest",
  "log_loss",
  "market_assisted",
  "match_date",
  "match_id",
  "match_horizon_days",
  "matches",
  "mean_goal_difference",
  "mean_points",
  "mean_position",
  "median_points",
  "median_position",
  "model",
  "model_id",
  "model_kind",
  "model_results_cutoff",
  "name",
  "omitted_probability",
  "outcome",
  "p_away",
  "p_draw",
  "p_home",
  "package_version",
  "played",
  "points_distribution",
  "points_intervals",
  "points_quantiles_05_50_95",
  "position_intervals",
  "position_probabilities",
  "position_sd",
  "pending_season_snapshots",
  "schema_version",
  "score_probabilities",
  "scored",
  "season_id",
  "settled",
  "simulations",
  "snapshot_id",
  "snapshots",
  "state_observed_at",
  "state_uncertainty",
  "status",
  "summary",
  "team_id",
  "teams",
  "unsettled",
  "verification",
]

# Only these keys may carry a long hexadecimal digest; anywhere else a digest is
# assumed to identify a provider file and is refused.
digest_keys = ["code_sha256", "commit"]

[boundary]
# Substrings that may never appear in a published key, checked against the
# allowlist itself as well as against every document.
forbidden_key_substrings = [
  "adjustment",
  "argv",
  "availability",
  "dependenc",
  "file",
  "fixture_source",
  "lineup",
  "manifest",
  "odds",
  "parquet",
  "path",
  "player",
  "provenance",
  "quote",
  "request",
  "roster",
  "secret",
  "snapshot_dir",
  "source",
  "squad",
  "token",
  "url",
]

# Values that identify a provider, a local file or a captured payload.
forbidden_value_patterns = [
  "^/",
  "(?i)/users/",
  "(?i)\\.(parquet|csv|db|gz|lock|log)\\b",
  "(?i)https?://",
  "(?i)\\bunderstat\\b",
  "(?i)football[-_ ]?data",
  "(?i)api[-_ ]?football",
  "(?i)\\bfpl\\b",
  "(?i)premierleague\\.com",
  "(?i)bookmaker",
  "(?i)\\bodds\\b",
]
